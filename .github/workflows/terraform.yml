name: Terraform — nova-eks

on:
  push:
    branches: [main]
    paths:
      - eks/terraform/**
      - .github/workflows/terraform.yml
  pull_request:
    branches: [main]
    paths:
      - eks/terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: eks/terraform
  AWS_REGION: il-central-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: il-central-1

jobs:
  terraform:
    name: Terraform Plan / Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ── PR: plan only ───────────────────────────────────────────────────
      - name: Terraform Plan (PR)
        id: plan
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen ? plan.slice(0, maxLen) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      # ── Push to main: three-phase apply ────────────────────────────────
      # Phase 1: VPC + EKS cluster (AWS-only, no K8s/Helm providers needed)
      - name: Terraform Apply — Phase 1 (VPC + EKS)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -target=module.vpc \
            -target=module.eks \
            -target=aws_iam_role.node \
            -target=aws_iam_role_policy_attachment.node_worker \
            -target=aws_iam_role_policy_attachment.node_cni \
            -target=aws_iam_role_policy_attachment.node_ecr \
            -target=aws_iam_openid_connect_provider.github \
            -target=aws_iam_role.github_actions \
            -target=aws_iam_role_policy_attachment.github_actions_admin

      # Phase 2: Install Calico operator — must complete before CRDs exist
      - name: Terraform Apply — Phase 2 (Calico operator)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -target=helm_release.calico

      # Phase 3: Calico CRs + node group + coredns (CRDs now exist)
      - name: Terraform Apply — Phase 3 (Calico CRs + nodes)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve
